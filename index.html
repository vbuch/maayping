<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maayping - Typing Adventure</title>
    <link rel="stylesheet" href="./css/styles.css?v=2" />
  </head>
  <body>
    <!-- Language Selection Screen -->
    <div id="menu-screen" class="screen">
      <div class="menu-content">
        <div class="title-section">
          <span class="title-emoji" id="title-emoji">🦫</span>
          <h1>Maayping</h1>
          <p class="subtitle">A Typing Adventure</p>
        </div>

        <div class="language-selection">
          <h2>Choose Your Language</h2>
          <div class="lang-buttons">
            <button class="lang-btn" data-lang="en">
              <span class="flag">🇬🇧</span>
              <span class="lang-name">English</span>
            </button>
            <button class="lang-btn" data-lang="bg">
              <span class="flag">🇧🇬</span>
              <span class="lang-name">Bulgarian</span>
            </button>
          </div>
        </div>

        <div class="difficulty-selection">
          <h2>Choose Your Speed</h2>
          <div class="difficulty-buttons">
            <button class="difficulty-btn selected" data-speed="1">
              Normal
            </button>
            <button class="difficulty-btn" data-speed="0.5">
              Gentle (Half Speed)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
      <canvas id="game-canvas" width="800" height="600"></canvas>
      <button id="pause-btn" title="Pause">⏸️</button>
      <input
        id="mobile-keyboard"
        class="mobile-keyboard-input"
        type="text"
        inputmode="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-hidden="true"
      />
    </div>

    <!-- Pause Modal -->
    <div id="pause-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Game Paused</h2>
        <div class="modal-buttons">
          <button id="resume-btn" class="primary-btn">Resume</button>
          <button id="quit-btn" class="secondary-btn">Quit to Menu</button>
        </div>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="result-title">Game Over!</h2>
        <p id="result-message"></p>
        <div class="stats">
          <p>Words typed: <span id="words-typed">0</span></p>
          <p>Accuracy: <span id="accuracy">0</span>%</p>
        </div>
        <div class="modal-buttons">
          <button id="play-again-btn" class="primary-btn">Play Again</button>
          <button id="menu-btn" class="secondary-btn">Main Menu</button>
        </div>
      </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal hidden">
      <div class="modal-content profile-modal" id="profile-modal-content">
        <h2 id="profile-modal-title">Create Profile</h2>
        <p id="profile-modal-message" class="profile-modal-message hidden"></p>
        <div class="profile-form">
          <label for="profile-name">Name</label>
          <input
            id="profile-name"
            type="text"
            maxlength="20"
            placeholder="Your name"
          />

          <label>Pick an emoji</label>
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>
        <div class="modal-buttons">
          <button id="create-profile-btn" class="primary-btn">Create</button>
          <button id="cancel-profile-btn" class="secondary-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Stats Modal -->
    <div id="stats-modal" class="modal hidden">
      <div class="modal-content stats-modal">
        <h2>Your Stats</h2>
        <p id="stats-empty" class="stats-empty hidden">
          Play a round to generate your first stats.
        </p>
        <div class="stats-grid" id="stats-grid">
          <div class="stats-section">
            <h3>Best by mode</h3>
            <ul id="stats-summary-list" class="stats-list"></ul>
          </div>
          <div class="stats-section">
            <h3>Recent runs</h3>
            <ul id="stats-recent-list" class="stats-list"></ul>
          </div>
        </div>
        <div class="modal-buttons">
          <button id="stats-close-btn" class="primary-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- Account Footer -->
    <div id="account-footer" class="account-footer">
      <button id="footer-profile-btn" type="button" class="footer-profile-btn">
        <span class="footer-avatar">
          <img id="auth-avatar-img" alt="Avatar" />
          <span id="auth-avatar-fallback" aria-hidden="true">👤</span>
        </span>
        <span class="footer-profile-text">Profile</span>
      </button>
      <button id="footer-login-btn" type="button">Log in</button>
      <button id="footer-stats-btn" type="button">Stats</button>
      <button id="footer-logout-btn" type="button">Log out</button>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
