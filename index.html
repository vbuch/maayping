<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maayping - Beaver Typing Adventure</title>
    <link rel="stylesheet" href="./css/styles.css?v=2" />
  </head>
  <body>
    <!-- Language Selection Screen -->
    <div id="menu-screen" class="screen">
      <div class="menu-content">
        <div class="title-section">
          <span class="title-emoji">🦫</span>
          <h1>Maayping</h1>
          <p class="subtitle">A Beaver Typing Adventure</p>
        </div>

        <div class="profile-selection">
          <h2>Profile:</h2>
          <div class="profile-buttons" id="profile-buttons"></div>
        </div>

        <div class="language-selection">
          <h2>Choose Your Language</h2>
          <div class="lang-buttons">
            <button class="lang-btn" data-lang="en">
              <span class="flag">🇬🇧</span>
              <span class="lang-name">English</span>
            </button>
            <button class="lang-btn" data-lang="bg">
              <span class="flag">🇧🇬</span>
              <span class="lang-name">Bulgarian</span>
            </button>
          </div>
        </div>

        <div class="difficulty-selection">
          <h2>Choose Your Speed</h2>
          <div class="difficulty-buttons">
            <button class="difficulty-btn selected" data-speed="1">
              Normal
            </button>
            <button class="difficulty-btn" data-speed="0.5">
              Gentle (Half Speed)
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
      <canvas id="game-canvas" width="800" height="600"></canvas>
      <button id="pause-btn" title="Pause">⏸️</button>
    </div>

    <!-- Pause Modal -->
    <div id="pause-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Game Paused</h2>
        <div class="modal-buttons">
          <button id="resume-btn" class="primary-btn">Resume</button>
          <button id="quit-btn" class="secondary-btn">Quit to Menu</button>
        </div>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="result-title">Game Over!</h2>
        <p id="result-message"></p>
        <div class="stats">
          <p>Words typed: <span id="words-typed">0</span></p>
          <p>Accuracy: <span id="accuracy">0</span>%</p>
        </div>
        <div class="modal-buttons">
          <button id="play-again-btn" class="primary-btn">Play Again</button>
          <button id="menu-btn" class="secondary-btn">Main Menu</button>
        </div>
      </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal hidden">
      <div class="modal-content profile-modal">
        <h2>Create Profile</h2>
        <div class="profile-form">
          <label for="profile-name">Name</label>
          <input
            id="profile-name"
            type="text"
            maxlength="20"
            placeholder="Your name"
          />

          <label>Pick an emoji</label>
          <div class="emoji-grid" id="emoji-grid"></div>
        </div>
        <div class="modal-buttons">
          <button id="create-profile-btn" class="primary-btn">Create</button>
          <button id="cancel-profile-btn" class="secondary-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
